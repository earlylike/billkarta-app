<title>My Notes</title>
<style>
:root{--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif;--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--bg:#eef0f6;--panel:#f8f9fc;--ink:#222839;--muted:#7a829a;--line:#d9ddea;--accent:#2f8f83;--accent-ink:#fff;--danger:#c8374b;
--c0:#fdf4c4;--c1:#d8f2e5;--c2:#dbeafb;--c3:#fbdce3;--c4:#e5dffa;--c5:#fde3cf;
--s0:#f0c230;--s1:#3dbd88;--s2:#4d99e6;--s3:#e5607c;--s4:#8872de;--s5:#ee8a43;
--shadow:0 10px 30px rgba(34,40,57,.14);color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#10131b;--panel:#171b26;--ink:#e8ebfa;--muted:#8890aa;--line:#2b3247;--accent:#58c4b4;--accent-ink:#0d1a18;--danger:#ff7a8c;
--c0:#38341f;--c1:#1f3a2e;--c2:#1f3047;--c3:#40242c;--c4:#2f2a4a;--c5:#40301f;
--shadow:0 10px 30px rgba(0,0,0,.5);color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{position:relative;height:100%;max-width:640px;margin:0 auto;overflow:hidden;background:var(--panel)}
.home{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:22px 18px 20px;background:linear-gradient(135deg,#0d2a78,#1d56c9);color:#fff;border-radius:0 0 28px 28px;box-shadow:0 8px 24px rgba(13,42,120,.28)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:48px;height:48px;border-radius:14px;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
h1{font-family:var(--serif);font-weight:400;font-size:32px;line-height:1;margin:0}
.top p{margin:6px 0 0;font-size:13px;color:rgba(255,255,255,.78)}
.word{display:block;height:27px;width:auto}
select{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;border-radius:999px;padding:8px 10px;font-size:13px;max-width:42%}
select option{color:#222839;background:#fff}
.searchbar{padding:14px 16px 4px}
.searchbar[hidden]{display:none}
.searchbar input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;font-size:16px}
.list{flex:1;overflow:auto;margin:0;padding:14px 14px 110px;list-style:none}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-left:6px solid var(--st);background:var(--bg2);border-radius:6px 16px 16px 6px;padding:14px 14px 14px 16px;margin-bottom:10px;min-height:72px;
-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .12s}
.item:active{transform:scale(.985)}
.txt{flex:1;min-width:0}
.txt b{display:block;font-size:17px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.txt span{display:block;margin-top:3px;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-size:13px;color:var(--muted);white-space:nowrap;text-align:right}
.pin{display:block;color:var(--st);font-weight:600;font-size:12px;margin-bottom:2px}
.empty{text-align:center;color:var(--muted);padding:60px 30px;font-size:15px;line-height:1.5}
.empty strong{display:block;font-family:var(--serif);font-weight:400;font-size:28px;color:var(--ink);margin-bottom:6px}
.fab{position:absolute;right:20px;bottom:92px;width:64px;height:64px;border-radius:50%;border:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#ffd447,#f59e0b);color:#0d2a78;box-shadow:0 10px 24px rgba(245,158,11,.45),inset 0 2px 0 rgba(255,255,255,.55);transition:transform .12s}
.fab:active{transform:scale(.92) rotate(-8deg)}
.fab svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;justify-content:space-around;border-top:1px solid var(--line);background:var(--panel);padding:8px 0}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;color:var(--muted);font-size:12px;padding:6px 22px;border-radius:12px}
.nav button.on{color:var(--accent)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.edit{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;background:var(--nbg,var(--c0));transform:translateX(100%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
[data-view="edit"] .edit{transform:none;visibility:visible;transition:transform .25s ease}
.ebar{display:flex;align-items:center;gap:6px;padding:14px 12px 6px}
.ebar .grow{flex:1;font-size:13px;color:var(--muted);text-align:center}
.tb{border:0;background:rgba(127,127,127,.16);border-radius:12px;padding:9px 14px;font-size:14px;font-weight:500}
.sw{display:flex;gap:10px;padding:8px 18px}
.sw button{width:30px;height:30px;border-radius:50%;border:3px solid transparent;background:var(--st);padding:0}
.sw button.sel{border-color:var(--ink)}
.title{border:0;background:none;width:100%;font-family:var(--serif);font-size:clamp(28px,8vw,36px);line-height:1.1;padding:10px 20px 6px}
.body{flex:1;min-height:0;width:100%;resize:none;border:0;background-color:transparent;font-family:var(--serif);font-size:18px;line-height:32px;padding:8px 20px 40px;
background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,rgba(127,127,127,.22) 31px,rgba(127,127,127,.22) 32px);background-attachment:local;background-position:0 8px}
.title:focus,.body:focus{outline:none}
.title::placeholder,.body::placeholder{color:var(--muted);opacity:.7}
.foot{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:8px 20px 12px}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(10,12,20,.5);padding:20px}
.modal[hidden]{display:none}
.card{width:100%;max-width:360px;background:var(--panel);border-radius:18px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:0}
.card p{margin:0;font-size:15px;line-height:1.45}
.card input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;font-size:16px}
.row{display:flex;gap:8px}.row .btn{flex:1}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:11px 14px;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.card .sw{padding:0;justify-content:space-between}

<script>
(function(){
var KEY="notepad.v1",TK="notepad.theme2",notes=[],active=null,sort="t",timer=null,target=null;
var $=function(i){return document.getElementById(i)},root=document.documentElement;
function ld(k){try{return localStorage.getItem(k)}catch(e){return null}}
function st(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(){try{var d=JSON.parse(ld(KEY)||"{}");notes=d.notes||[];active=d.active;sort=d.sort||"t"}catch(e){}}
function save(){st(KEY,JSON.stringify({notes:notes,active:active,sort:sort}))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function byId(id){return notes.find(function(n){return n.id===id})}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtD(t){var d=new Date(t);return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear()}
function fmt(t){var d=new Date(t);return d.toDateString()===new Date().toDateString()?d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):d.toLocaleDateString([],{day:"numeric",month:"short"})}
var MOON='<path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/>',SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>';
function theme(m){root.setAttribute("data-theme",m);st(TK,m);$("nTheme").querySelector("svg").innerHTML=m==="dark"?SUN:MOON}
theme(ld(TK)||"light");
$("nTheme").onclick=function(){tab("nTheme");theme(root.getAttribute("data-theme")==="dark"?"light":"dark")};

function swatches(box,cur,cb){box.innerHTML="";for(var i=0;i<6;i++)(function(i){var b=document.createElement("button");
  b.style.setProperty("--st","var(--s"+i+")");b.className=i===cur?"sel":"";b.setAttribute("aria-label","Color "+(i+1));b.onclick=function(){cb(i)};box.appendChild(b)})(i)}
function head(n){var l=n.body.split("\n");return n.title||(l[0]||"").trim()||"Untitled note"}
function sub(n){return n.title?n.body:n.body.split("\n").slice(1).join(" ")}

function render(){
  var q=$("q").value.trim().toLowerCase(),ul=$("list");ul.innerHTML="";
  var s=notes.filter(function(n){return !q||(n.title+" "+n.body).toLowerCase().indexOf(q)>-1});
  s.sort(function(a,b){var p=(b.pinned?1:0)-(a.pinned?1:0);if(p)return p;
    if(sort==="a")return head(a).localeCompare(head(b));if(sort==="c")return (a.c-b.c)||(b.t-a.t);
    if(sort==="c0")return (b.k||b.t)-(a.k||a.t);return b.t-a.t});
  
  if(!s.length){var e=document.createElement("li");e.className="empty";
    e.innerHTML=q?"<strong>Nothing found</strong>Try a different word.":"<strong>A blank page</strong>Select + to write your first note.";ul.appendChild(e)}
  s.forEach(function(n){
    var li=document.createElement("li"),b=document.createElement("button");b.className="item";
    b.style.setProperty("--st","var(--s"+n.c+")");b.style.setProperty("--bg2","var(--c"+n.c+")");
    var t=document.createElement("div");t.className="txt";
    var h=document.createElement("b");h.textContent=head(n);var p=document.createElement("span");p.textContent=sub(n).replace(/\s+/g," ").slice(0,80)||"No more text";
    if(n.pinned){var pn=document.createElement("em");pn.className="pin";pn.style.fontStyle="normal";pn.textContent="Pinned";t.appendChild(pn)}
    t.appendChild(h);t.appendChild(p);
    var d=document.createElement("div");d.className="date";d.textContent=fmtD(n.t);
    var av=document.createElement("div");av.className="av";av.setAttribute("aria-hidden","true");av.textContent=(Array.from(head(n))[0]||"N").toUpperCase();
    b.appendChild(av);b.appendChild(t);b.appendChild(d);
    var lp=null,fired=false,sx=0,sy=0;
    b.addEventListener("pointerdown",function(e){fired=false;sx=e.clientX;sy=e.clientY;clearTimeout(lp);lp=setTimeout(function(){fired=true;openModal(n)},500)});
    b.addEventListener("pointermove",function(e){if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8)clearTimeout(lp)});
    ["pointerup","pointercancel","pointerleave"].forEach(function(ev){b.addEventListener(ev,function(){clearTimeout(lp)})});
    b.addEventListener("contextmenu",function(e){e.preventDefault();clearTimeout(lp);fired=true;openModal(n)});
    b.onclick=function(){if(fired){fired=false;return}openEditor(n.id)};
    li.appendChild(b);ul.appendChild(li)});
}
function make(){var n={id:uid(),title:"",body:"",pinned:false,c:0,t:Date.now(),k:Date.now()};notes.unshift(n);save();return n}
function paint(n){$("edit").style.setProperty("--nbg","var(--c"+n.c+")");swatches($("eSw"),n.c,function(i){n.c=i;save();paint(n);render()})}
function counts(n){var w=n.body.trim()?n.body.trim().split(/\s+/).length:0;$("count").textContent=w+(w===1?" word":" words");$("when").textContent="Edited "+fmt(n.t)}
function openEditor(id,focus){var n=byId(id);if(!n)return;active=id;$("title").value=n.title;$("body").value=n.body;$("pin").textContent=n.pinned?"Unpin":"Pin";$("saved").textContent="Saved";
  paint(n);counts(n);$("app").dataset.view="edit";sync();setEditing(!!focus);if(focus)setTimeout(function(){$("body").focus()},260)}
function closeEditor(){var n=byId(active);if(n&&!n.title.trim()&&!n.body.trim()){notes=notes.filter(function(x){return x!==n})}
  save();$("app").dataset.view="list";render();sync()}
function edit(){var n=byId(active);n.title=$("title").value;n.body=$("body").value;n.t=Date.now();$("saved").textContent="Saving…";counts(n);
  clearTimeout(timer);timer=setTimeout(function(){save();$("saved").textContent="Saved"},350)}
$("title").addEventListener("input",edit);$("body").addEventListener("input",edit);
var editing=false,ICON_EDIT='<path d="M4 20l1.2-4.2L16.6 4.4a2.1 2.1 0 0 1 3 3L8.2 18.8 4 20z"/><path d="M14.5 6.5l3 3"/>',ICON_SAVE='<path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/>';
function setEditing(b){editing=b;$("title").readOnly=!b;$("body").readOnly=!b;var f=$("efab");f.className="efab "+(b?"ef-save":"ef-edit");f.setAttribute("aria-label",b?"Save note":"Edit note");
  f.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+(b?ICON_SAVE:ICON_EDIT)+'</svg><span>'+(b?"Save":"Edit")+'</span>';$("saved").textContent=b?"Editing":"Saved"}
$("efab").onclick=function(){
  if(!editing){setEditing(true);var t=$("body");t.focus();t.setSelectionRange(t.value.length,t.value.length);return}
  clearTimeout(timer);save();setEditing(false);$("body").blur();$("title").blur()};

var layer=false,skip=false;
function overlayOpen(){return $("app").dataset.view==="edit"||!$("modal").hidden}
function sync(){var o=overlayOpen();
  if(o&&!layer){try{history.pushState({l:1},"");layer=true}catch(e){}}
  else if(!o&&layer){layer=false;skip=true;setTimeout(function(){skip=false},500);try{history.back()}catch(e){skip=false}}}
window.addEventListener("popstate",function(){
  if(skip){skip=false;return}
  layer=false;
  if(!$("modal").hidden){$("modal").hidden=true;target=null}
  else if($("app").dataset.view==="edit"){closeEditor()}
  sync()});
$("back").onclick=closeEditor;
$("new").onclick=function(){var n=make();render();openEditor(n.id,true)};
$("pin").onclick=function(){var n=byId(active);n.pinned=!n.pinned;$("pin").textContent=n.pinned?"Unpin":"Pin";save()};
$("more").onclick=function(){openModal(byId(active))};
$("sort").onchange=function(){sort=$("sort").value;save();render()};
$("q").addEventListener("input",function(){$("qClear").hidden=!$("q").value;render()});
$("qClear").onclick=function(){$("q").value="";$("qClear").hidden=true;render();$("q").focus()};
$("nSearch").onclick=function(){var h=$("sbar").hidden=!$("sbar").hidden;tab(h?"nNotes":"nSearch");if(!h)$("q").focus();else{$("q").value="";$("qClear").hidden=true;render()}};
function tab(id){["nNotes","nSearch","nTheme"].forEach(function(i){$(i).classList.toggle("on",i===id)})}
$("nNotes").onclick=function(){tab("nNotes");$("list").scrollTo({top:0,behavior:"smooth"})};

function openModal(n){target=n.id;$("mName").value=n.title;$("mMain").style.display="flex";$("mConfirm").style.display="none";
  swatches($("mSw"),n.c,function(i){n.c=i;save();if(active===n.id)paint(n);swatches($("mSw"),i,arguments.callee);render()});$("modal").hidden=false;sync()}
function closeModal(){$("modal").hidden=true;target=null;sync()}
function saveName(){var n=byId(target);if(n){n.title=$("mName").value.trim();save();if(active===n.id)$("title").value=n.title;render()}closeModal()}
$("mSave").onclick=saveName;$("mClose").onclick=closeModal;
$("mName").addEventListener("keydown",function(e){if(e.key==="Enter")saveName()});
$("modal").addEventListener("click",function(e){if(e.target===$("modal"))closeModal()});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!$("modal").hidden)closeModal()});
$("mDelAsk").onclick=function(){var n=byId(target);$("mMsg").textContent="Delete “"+head(n)+"”? This can’t be undone.";$("mMain").style.display="none";$("mConfirm").style.display="flex"};
$("mBack").onclick=function(){$("mConfirm").style.display="none";$("mMain").style.display="flex"};
$("mDel").onclick=function(){notes=notes.filter(function(x){return x.id!==target});if(active===target){active=null;$("app").dataset.view="list"}save();closeModal();render()};

load();
if(!notes.length){var w=make();w.title="Welcome";w.body="Select + to add a note. Pick a color for each one, pin your favorites, and press and hold any note to rename or delete it.";w.c=2;save()}
$("sort").value=sort;render();
})();
</script>
</body>
</html>
